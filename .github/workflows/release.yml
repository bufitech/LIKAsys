name: Release

# Niset automatikisht kur shtyhet nje tag v1.2.3
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versioni (p.sh. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Merr kodin
        uses: actions/checkout@v4

      - name: Percakto versionin
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versioni: $V"

      - name: .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Veglat (NSIS + Pillow)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nsis python3-pil

      - name: Ndertimi
        run: |
          chmod +x ./build.sh
          ./build.sh "${{ steps.ver.outputs.version }}"

      - name: Shenimet e versionit
        id: notes
        run: |
          V="${{ steps.ver.outputs.version }}"
          if grep -q "^## v$V" CHANGELOG.md; then
            awk -v tag="## v$V" '
              $0 ~ "^" tag { on=1; next }
              on && /^## v/ { exit }
              on { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          else
            echo "Permiresime dhe rregullime te vogla." > RELEASE_NOTES.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "**Si behet update:** shkarko \`LIKAsys-Setup-$V.exe\` dhe hape."
            echo "Nese e ke LIKAsys te instaluar, update-i te shfaqet vete brenda programit."
            echo ""
            echo "LIKAsys, Made in Kosovo with :heart: - [Likaapps.com](https://Likaapps.com)"
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Krijo Release-in
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LIKAsys v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/LIKAsys-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Ruaj artifact-in
        uses: actions/upload-artifact@v4
        with:
          name: LIKAsys-Setup-${{ steps.ver.outputs.version }}
          path: dist/LIKAsys-Setup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error
